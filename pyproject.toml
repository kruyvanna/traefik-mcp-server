[project]
name = "traefik-mcp"
version = "0.1.0"
description = "MCP server for managing this host's Traefik dynamic file-provider config"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.scripts]
traefik-mcp = "traefik_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traefik_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
